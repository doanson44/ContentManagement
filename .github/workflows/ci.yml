name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore ContentManagement.sln
      - name: Build
        run: dotnet build ContentManagement.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/ContentManagement.UnitTests/ContentManagement.UnitTests.csproj --no-build --configuration Release
      - name: Integration tests
        run: dotnet test tests/ContentManagement.IntegrationTests/ContentManagement.IntegrationTests.csproj --no-build --configuration Release
      - name: Publish standalone File API
        run: dotnet publish src/ContentManagement.FileApi/ContentManagement.FileApi.csproj --configuration Release --runtime win-x86 --self-contained true --output artifacts/fileapi-publish
      - name: Validate and package standalone File API
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/fileapi-publish/ContentManagement.FileApi.exe
          mkdir -p artifacts
          (cd artifacts/fileapi-publish && zip -qr ../ContentManagement-FileApi-win-x86.zip .)
          unzip -l artifacts/ContentManagement-FileApi-win-x86.zip
      - name: Publish Windows x86 deployment
        run: dotnet publish src/ContentManagement.Server/ContentManagement.Server.csproj --configuration Release --runtime win-x86 --self-contained true --output artifacts/publish
      - name: Validate and package deployment
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/publish/ContentManagement.Server.exe
          test -f artifacts/publish/wwwroot/index.html
          test -f artifacts/publish/wwwroot/_framework/blazor.webassembly.js
          mkdir -p artifacts
          (cd artifacts/publish && zip -qr ../ContentManagement-win-x86.zip .)
          unzip -l artifacts/ContentManagement-win-x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ContentManagement-FileApi-win-x86
          path: artifacts/ContentManagement-FileApi-win-x86.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ContentManagement-win-x86
          path: artifacts/ContentManagement-win-x86.zip
          if-no-files-found: error
          retention-days: 14
